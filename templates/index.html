<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Extractor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .logo h1 { font-size: 24px; font-weight: 700; }
        
        .search-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-form { display: flex; gap: 12px; }
        .search-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-input:focus { border-color: #667eea; }
        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        
        .section { margin-bottom: 24px; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .section-header h2 { font-size: 18px; }
        
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;
        }
        .video-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-thumbnail {
            height: 100px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            color: rgba(255,255,255,0.3);
            position: relative;
        }
        .video-duration {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,0.8);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
        }
        .video-info { padding: 14px; }
        .video-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .video-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-small { flex: 1; padding: 10px; font-size: 13px; }
        
        .downloads-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .download-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .download-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .download-info { flex: 1; }
        .download-name { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
        .download-status { font-size: 13px; color: rgba(255,255,255,0.5); }
        .progress-bar {
            height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 8px; overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        .empty-state {
            text-align: center; padding: 40px;
            color: rgba(255,255,255,0.5);
        }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        
        .checkbox-wrapper {
            display: flex; align-items: center; gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            cursor: pointer;
        }
        .checkbox-wrapper input { width: 18px; height: 18px; cursor: pointer; }
        
        .status-connected {
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">🎙️</div>
                <h1>Speech Extractor</h1>
            </div>
            <div class="status-connected">● Local Server</div>
        </header>

        <section class="search-section">
            <form class="search-form" onsubmit="search(event)">
                <input type="text" class="search-input" id="searchInput" 
                       placeholder="Search for a person (e.g., Barack Obama, Steve Jobs)" />
                <button type="submit" class="btn btn-primary">🔍 Search</button>
            </form>
        </section>

        <section class="section" id="resultsSection" style="display: none;">
            <div class="section-header">
                <h2>📺 Search Results</h2>
                <div>
                    <button class="btn btn-secondary btn-small" onclick="selectAll()">Select All</button>
                    <button class="btn btn-success btn-small" onclick="downloadSelected()">
                        ⬇️ Download Selected
                    </button>
                </div>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </section>

        <section class="downloads-section">
            <div class="section-header">
                <h2>📥 Downloads</h2>
                <button class="btn btn-secondary btn-small" onclick="clearDownloads()">Clear</button>
            </div>
            <div id="downloadsList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>Downloads will appear here</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        let currentResults = [];
        let selectedIds = new Set();
        
        async function search(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            const btn = e.target.querySelector('button');
            btn.textContent = 'Searching...';
            btn.disabled = true;
            
            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if (data.error) {
                    alert(data.error);
                    btn.textContent = '🔍 Search';
                    btn.disabled = false;
                    return;
                }
                
                currentResults = data.videos;
                selectedIds.clear();
                
                document.getElementById('resultsSection').style.display = 'block';
                document.getElementById('resultsGrid').innerHTML = data.videos.map(v => `
                    <div class="video-card">
                        <div class="video-thumbnail">
                            🎬
                            <div class="video-duration">${v.duration}</div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <label class="checkbox-wrapper">
                                <input type="checkbox" onchange="toggleSelect('${v.id}', this)" />
                                <span>Select</span>
                            </label>
                            <div class="video-actions">
                                <button class="btn btn-success btn-small" onclick="downloadOne('${v.id}')">
                                    ⬇️ Download
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('resultCount').textContent = `${data.count} results`;
            } catch (err) {
                alert('Search failed: ' + err);
            }
            
            btn.textContent = '🔍 Search';
            btn.disabled = false;
        }
        
        function toggleSelect(id, checked) {
            if (checked) selectedIds.add(id);
            else selectedIds.delete(id);
        }
        
        function selectAll() {
            currentResults.forEach(v => selectedIds.add(v.id));
            document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = true);
        }
        
        async function downloadOne(id) {
            const video = currentResults.find(v => v.id === id);
            if (!video) return;
            
            addDownloadItem(video);
            
            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({video_ids: [id]})
                });
                const data = await res.json();
                console.log(data.message);
            } catch (err) {
                console.error(err);
            }
        }
        
        async function downloadSelected() {
            if (selectedIds.size === 0) {
                alert('Select videos first');
                return;
            }
            
            const selected = currentResults.filter(v => selectedIds.has(v.id));
            selected.forEach(v => addDownloadItem(v));
            
            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({video_ids: Array.from(selectedIds)})
                });
                const data = await res.json();
                console.log(data.message);
            } catch (err) {
                console.error(err);
            }
        }
        
        function addDownloadItem(video) {
            const list = document.getElementById('downloadsList');
            const empty = list.querySelector('.empty-state');
            if (empty) empty.remove();
            
            const item = document.createElement('div');
            item.className = 'download-item';
            item.id = `download-${video.id}`;
            item.innerHTML = `
                <div class="download-icon">⏳</div>
                <div class="download-info">
                    <div class="download-name">${video.title}</div>
                    <div class="download-status">Starting...</div>
                </div>
            `;
            list.insertBefore(item, list.firstChild);
        }
        
        async function checkDownloads() {
            try {
                const res = await fetch('/api/downloads');
                const data = await res.json();
                
                data.downloads.forEach(d => {
                    const item = document.getElementById(`download-${d.title?.substring(0, 20)}`) || 
                                 document.querySelector('.download-item');
                    
                    if (item && d.success) {
                        item.querySelector('.download-icon').textContent = '✓';
                        item.querySelector('.download-status').textContent = 'Complete';
                    }
                });
            } catch (err) {
                console.error(err);
            }
        }
        
        async function clearDownloads() {
            try {
                await fetch('/api/clear', {method: 'POST'});
                document.getElementById('downloadsList').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>Downloads will appear here</p>
                    </div>
                `;
            } catch (err) {
                console.error(err);
            }
        }
        
        // Check downloads every 2 seconds
        setInterval(checkDownloads, 2000);
    </script>
</body>
</html>
